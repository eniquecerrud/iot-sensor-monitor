[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sensormon"
version = "0.1.0"
description = "Monitorización de sensores IoT sobre MQTT con detección de anomalías y panel en tiempo real"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["iot", "mqtt", "sensors", "anomaly-detection", "dashboard"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "paho-mqtt>=2.1",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "typer>=0.12",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
ml = ["numpy>=1.26", "scikit-learn>=1.4"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
sensormon = "sensormon.cli:main"

[project.urls]
Homepage = "https://github.com/eniquecerrud/iot-sensor-monitor"

[tool.hatch.build.targets.wheel]
packages = ["src/sensormon"]

[tool.hatch.build.targets.wheel.force-include]
"src/sensormon/dashboard/static/index.html" = "sensormon/dashboard/static/index.html"
"src/sensormon/dashboard/static/app.js" = "sensormon/dashboard/static/app.js"
"src/sensormon/dashboard/static/styles.css" = "sensormon/dashboard/static/styles.css"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]

[tool.ruff.lint.isort]
known-first-party = ["sensormon", "tests"]

[tool.ruff.lint.per-file-ignores]
"src/sensormon/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore:Using `httpx` with `starlette.testclient`:Warning",
]

[tool.coverage.run]
branch = true
source = ["sensormon"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]
