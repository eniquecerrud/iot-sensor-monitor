<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sensormon</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23121816'/%3E%3Cpath d='M2 11.2 5.2 7.4 8 9.2 13 3.5' stroke='%23e07a3d' fill='none' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="brand">
          <span class="mark" aria-hidden="true"></span>
          <div>
            <h1>Sensormon</h1>
            <p>Telemetría IoT en tiempo real</p>
          </div>
        </div>
        <div class="top-meta">
          <span id="clock" class="clock">--:--:--</span>
          <span id="status" class="status is-wait">conectando</span>
        </div>
      </header>

      <aside class="sidebar">
        <div class="panel-head">
          <h2>Dispositivos</h2>
        </div>
        <div id="devices" class="device-list"></div>
      </aside>

      <main>
        <section id="summary" class="summary">
          <div>
            <p id="device-name" class="device-name">Sin dispositivo</p>
            <p id="device-location" class="device-location">Esperando telemetría</p>
          </div>
        </section>
        <section id="kpis" class="kpis"></section>
        <section id="charts" class="charts"></section>
      </main>

      <aside class="alerts-pane">
        <div class="panel-head">
          <h2>Alertas</h2>
          <span id="alert-count" class="count">0</span>
        </div>
        <div id="alerts" class="alert-list"></div>
      </aside>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
